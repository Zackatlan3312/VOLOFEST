  <script src="js/analytics.js"></script>

<body>

<!-- ══════════ TEXTURAS GLOBALES ══════════ -->
<div class="grain" aria-hidden="true"></div>
<div class="scanlines" aria-hidden="true"></div>
<div class="lightning" id="lightning" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div class="bat-layer" id="batLayer" aria-hidden="true"></div>

<!-- ══════════ LOADER ══════════ -->
<div class="loader" id="loader">
  <div class="loader-inner">
    <img decoding="async" fetchpriority="high" src="assets/brand/volofest-logo.webp" alt="" class="loader-logo">
    <p class="loader-txt">ABRIENDO LA CRIPTA<span class="dots"><i>.</i><i>.</i><i>.</i></span></p>
  </div>
</div>

<!-- ══════════ PRÓXIMAMENTE ══════════ -->
<main class="hero hero-soon" id="top">
  <div class="hero-content">
    <p class="hero-kicker"><span class="line"></span> LA VOLOBAND PRESENTA <span class="line"></span></p>

    <img decoding="async" fetchpriority="high" src="assets/brand/volofest-logo.webp" alt="VOLOFEST" class="hero-logo flicker">

    <h1 class="soon-title">
      <span class="soon-kicker">Próximamente</span>
      <span class="soon-main" data-glitch="SEGUNDA EDICIÓN">SEGUNDA EDICIÓN</span>
    </h1>
  </div>

  <a href="https://www.lavoloband.com" target="_blank" rel="noopener" class="soon-brand" aria-label="La Voloband">
    <img decoding="async" src="assets/brand/lavoloband.webp" alt="La Voloband">
  </a>
</main>

<script src="js/main.js"></script>
